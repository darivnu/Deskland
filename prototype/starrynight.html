<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deskland · Starry Night</title>
<!--
  Starry Night: a sky of brush strokes in the manner of Van Gogh, generated by code.
  The desktop icons are the stars: each icon (or group of icons) gets a halo of yellow strokes,
  and the current of the sky bends around the halos and around a few big swirls placed in the
  widest gaps the icons leave. Moon, cypress, hills and village fill the free space.

  Built like the Meadow and Beach themes:
  - CPU, only when the icons or the settings change: a small grid (one cell every STEP px) holding
    the direction of the current, the distance to the edge of the star halos (a sum of Gaussians
    around the icons, bent by noise, as Meadow does for its clouds) and the light of the swirls;
    plus the profile of the hills and the place of the moon, the cypress and the church.
  - Moving an icon blends the old state into the new one, so every shape travels instead of fading.
  - One shader draws everything at the real pixels of the screen. Each brush stroke is computed
    one by one: a grid of cells, at most one stroke per cell, as Meadow does for its grass lines.

  Modes: ?wallpaper=1 (desktop host), ?preview=1 (Settings iframe), none (browser demo).
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0f1b4c; font: 12px -apple-system, "Segoe UI", sans-serif; }
  #cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #ghosts { position: fixed; inset: 0; pointer-events: none; }
  .ghost { position: absolute; box-sizing: border-box; }
  .ghost i { display: block; width: 46px; height: 46px; margin: 4px auto 6px; border-radius: 11px; background: rgba(255, 255, 255, .88); box-shadow: 0 1px 4px rgba(0, 0, 0, .35); }
  .ghost b { display: block; width: 68%; height: 10px; margin: 0 auto; border-radius: 5px; background: rgba(255, 255, 255, .8); box-shadow: 0 1px 3px rgba(0, 0, 0, .35); }
  body.demo .ghost { pointer-events: auto; cursor: grab; touch-action: none; }
  body.demo .ghost.drag { cursor: grabbing; opacity: .75; }
  #hint { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); padding: 6px 12px; border-radius: 14px; color: #e8eefc; background: rgba(8, 14, 40, .55); pointer-events: none; }
  body.wall #hint { display: none; }
  #nogl { display: none; position: fixed; inset: 0; align-items: center; justify-content: center; color: #e8eefc; background: linear-gradient(#0f1b4c, #2a5db0); }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="ghosts"></div>
<div id="hint">Drag the icons: the stars follow them</div>
<div id="nogl">WebGL2 is not available, so this theme cannot be drawn.</div>

<script>
'use strict';

/* ======================================================================
   Parameters
   ====================================================================== */
const CELL_W = 76, CELL_H = 100, GRID_X0 = 4, GRID_Y0 = 6, TASKBAR = 48;   // read by share.js
const STEP = 6;            // CSS px between cells of the field grid
const RDX = 8;             // CSS px between samples of the hill ridge
const MORPH_MS = 1800;
const BIG = 120;           // CSS px: a rectangle at least this wide and tall is a widget, not an icon

const QS = new URLSearchParams(location.search);
const WALL = QS.has('wallpaper');     // loaded by the desktop host
const PREVIEW = QS.has('preview');    // loaded by Settings in an iframe
// Defaults must match themes.json. quality is not exposed.
const P = { halo: 90, speed: 1, stroke: 6, swirls: 2, palette: 0, showMoon: 1, showCypress: 1, showVillage: 1, quality: 2 };
const DEFAULTS = Object.assign({}, P);
const RANGE = { halo: [40, 200], speed: [0, 3], stroke: [3, 12], swirls: [0, 4], palette: [0, 2], showMoon: [0, 1], showCypress: [0, 1], showVillage: [0, 1] };
const INTEGER = ['swirls', 'palette', 'showMoon', 'showCypress', 'showVillage'];

// sky: dark, mid, light, pale, star, star highlight, star core, tint
const PALS = [
  { sky: ['#0d1642', '#1d479c', '#5b8fd8', '#e9ecd0', '#f6cf3a', '#fff6c4', '#e0801c', '#3aa39b'],
    hill: [['#2b4f9e', '#3f6fc0', '#6795d6'], ['#1f3f86', '#2a55a3', '#3c79b8'], ['#12284f', '#1b3a5c', '#24506a']],
    outline: '#0a1230', cyp: ['#0b1711', '#16301f', '#3b3a1d', '#2f5a3a'],
    wall: ['#3a5a9a', '#56789f', '#7d9bc0'], roof: ['#172659', '#28407a'], win: ['#f7d038', '#f2a23a'] },
  { sky: ['#24143f', '#75386f', '#de868c', '#fde6c6', '#ffd66e', '#fff4d6', '#ee6a3c', '#f0a45c'],
    hill: [['#5a3a7e', '#7a4f95', '#a56ea8'], ['#43275f', '#5a3477', '#7a4a8a'], ['#24153a', '#33204a', '#4a2c50']],
    outline: '#160b26', cyp: ['#140f1c', '#2a1d2e', '#4a2a2a', '#3d3552'],
    wall: ['#6b4a86', '#8a6aa0', '#b48aa8'], roof: ['#3a2052', '#5a2c4c'], win: ['#ffd66e', '#ff9d5c'] },
  { sky: ['#041c26', '#0d5559', '#4bb497', '#e4f5d4', '#f1ec8a', '#fcfcdc', '#e2952b', '#2c86ad'],
    hill: [['#0f4a52', '#17666a', '#2f8f86'], ['#0b363f', '#114c55', '#1c6b68'], ['#061c22', '#0a2c30', '#12403a']],
    outline: '#02110f', cyp: ['#04100c', '#0c2418', '#33321a', '#1f4a30'],
    wall: ['#1f5a66', '#3a7a80', '#6aa59a'], roof: ['#0b2f3a', '#14454c'], win: ['#f1ec8a', '#f0b24a'] },
];
// One flat list of colours for the shader: sky 0-7, hills 8-16, outline 17, cypress 18-21, walls 22-24, roofs 25-26, windows 27-28
const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255);
for (const p of PALS) p.rgb = new Float32Array([...p.sky, ...p.hill.flat(), p.outline, ...p.cyp, ...p.wall, ...p.roof, ...p.win].flatMap(rgb));

/* ======================================================================
   State (cv, icons, W, H, WALL, paused, frameN and draw() are also used by share.js)
   ====================================================================== */
const cv = document.getElementById('cv');
const gl = cv.getContext('webgl2', { alpha: false, antialias: false, depth: false, stencil: false });
let W = 0, H = 0, Gw = 0, Gh = 0, Rn = 0;
let icons = [];
let paused = false, frameN = 0;
let seed = 20261113;
let phase = 0, lastT = 0, dirty = true;
// What is on screen is always a blend: from → to. Field grid: x, y of the current, distance to the halo edge, light
let fFrom = null, fTo = null, fCur = null, rFrom = null, rTo = null, rCur = null, NZ = null;
let oFrom = { moon: null, cyp: null, church: null }, oTo = { moon: null, cyp: null, church: null };
let morphT0 = -1e9, morphDur = 1, curMix = 1, sentMix = -1;
let colFrom = PALS[0].rgb.slice(), colTo = PALS[0].rgb, colNow = PALS[0].rgb.slice(), colT0 = -1e9;
const L = { stars: [], moon: null, cyp: null, church: null, swirls: [], ridge: new Float32Array(2) };   // target layout

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const ease = e => { e = clamp(e, 0, 1); return e < 0.5 ? 2 * e * e : 1 - Math.pow(-2 * e + 2, 2) / 2; };
function mulberry32(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

/* ======================================================================
   CPU noise and a tileable noise texture (same recipe as Meadow)
   ====================================================================== */
function hash2(x, y, k = 0) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(seed + k, 2246822519);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y, k = 0) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const a = hash2(ix, iy, k), b = hash2(ix + 1, iy, k), c = hash2(ix, iy + 1, k), d = hash2(ix + 1, iy + 1, k);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}
function fbm(x, y, k = 0) {
  let a = 0.5, s = 0;
  for (let i = 0; i < 4; i++) { s += a * vnoise(x, y, k + i * 7); x = x * 2.03 + 17.1; y = y * 2.03 + 17.1; a *= 0.5; }
  return s;
}
function tileNoise(x, y, px, k) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const m = v => ((v % px) + px) % px;
  const x0 = m(ix), x1 = m(ix + 1), y0 = m(iy), y1 = m(iy + 1);
  const a = hash2(x0, y0, k), b = hash2(x1, y0, k), c = hash2(x0, y1, k), d = hash2(x1, y1, k);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}
function makeNoiseImage() {
  const S = 256, d = new Uint8Array(S * S * 4), keep = seed;
  seed = 977;                                             // the texture does not depend on the seed of the picture
  const chans = [[8, 16, 32, 64], [8, 16, 32, 64], [8, 16, 32], [16, 32, 64, 128]];
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const u = x / S, v = y / S, i = (y * S + x) * 4;
    for (let c = 0; c < 4; c++) {
      let s = 0, w = 0.5, tw = 0;
      for (let o = 0; o < chans[c].length; o++) { const pr = chans[c][o]; s += w * tileNoise(u * pr, v * pr, pr, 100 + c * 50 + o * 13); tw += w; w *= 0.5; }
      d[i + c] = clamp((s / tw - 0.5) * 1.9 + 0.5, 0, 1) * 255;
    }
  }
  seed = keep;
  return { S, d };
}
// Noise that bends the halos, so that their edge is not a rounded rectangle
function buildWarp() {
  const N = Gw * Gh;
  NZ = { wx: new Float32Array(N), wy: new Float32Array(N) };
  for (let gy = 0; gy < Gh; gy++) for (let gx = 0; gx < Gw; gx++) {
    const i = gy * Gw + gx, x = gx * STEP, y = gy * STEP;
    NZ.wx[i] = fbm(x * 0.0028, y * 0.0028, 1) - 0.47;
    NZ.wy[i] = fbm(x * 0.0028, y * 0.0028, 2) - 0.47;
  }
}

/* ======================================================================
   Layout: where the hills, the cypress, the moon, the church and the swirls go
   ====================================================================== */
const unit = () => clamp(H / 1100, 0.6, 1.6);            // size of the small things, relative to the screen
// Signed distance to an icon, taken as a rounded box (negative inside)
function sdStar(px, py, s) {
  const ax = Math.abs(px - s.cx) - (s.hw - s.r), ay = Math.abs(py - s.cy) - (s.hh - s.r);
  return Math.hypot(Math.max(ax, 0), Math.max(ay, 0)) + Math.min(Math.max(ax, ay), 0) - s.r;
}
function ridgeAt(x) {
  const f = clamp(x / RDX, 0, L.ridge.length - 1.001), i = f | 0;
  return L.ridge[i] + (L.ridge[i + 1] - L.ridge[i]) * (f - i);
}
// Free height above the bottom edge in the column [x - hw, x + hw]
function freeHeight(x, hw) {
  let h = H;
  for (const ic of icons) if (ic.x < x + hw + 18 && ic.x + ic.w > x - hw - 18) h = Math.min(h, H - (ic.y + ic.h) - 22);
  return Math.max(0, h);
}
// Room around a point of the sky: distance to the icons (plus pad), the edges, the hills, the cypress and the given circles
function clearance(x, y, circles, pad) {
  let c = Math.min(x, W - x, y, H - ridgeAt(x) - y);
  for (const s of L.stars) c = Math.min(c, sdStar(x, y, s) - pad);
  if (L.cyp) c = Math.min(c, Math.hypot(Math.max(Math.abs(x - L.cyp.x) - L.cyp.hw, 0), Math.max(H - L.cyp.h - y, 0)));
  for (const k of circles) c = Math.min(c, Math.hypot(x - k.x, y - k.y) - k.r);
  return c;
}
function layout() {
  const rng = mulberry32(seed);
  const a1 = rng() * 6.28, a2 = rng() * 6.28, u = unit();
  L.stars = icons.map(ic => {
    const hw = ic.w / 2, hh = ic.h / 2;
    // widgets and other big rectangles get a thin ring, not a full star (several of them would merge into one yellow blot)
    return { cx: ic.x + hw, cy: ic.y + hh, hw, hh, r: Math.min(hw, hh, 40), big: Math.min(ic.w, ic.h) >= BIG };
  });

  // Hills: a wavy ridge that stays below every icon and slopes down towards them
  const ridge = new Float32Array(Rn);
  if (P.showVillage === 1) {
    for (let i = 0; i < Rn; i++) {
      const x = i * RDX;
      let cap = H * (0.165 + 0.045 * Math.sin(x * 0.0041 + a1) + 0.025 * Math.sin(x * 0.0113 + a2));
      for (const ic of icons) if (x > ic.x - 40 && x < ic.x + ic.w + 40) cap = Math.min(cap, H - (ic.y + ic.h) - 28);
      ridge[i] = Math.max(0, cap);
    }
    const slope = 0.45 * RDX;
    for (let i = 1; i < Rn; i++) ridge[i] = Math.min(ridge[i], ridge[i - 1] + slope);
    for (let i = Rn - 2; i >= 0; i--) ridge[i] = Math.min(ridge[i], ridge[i + 1] + slope);
    for (let pass = 0; pass < 3; pass++) {               // round the corners the slope limit leaves
      let prev = ridge[0];
      for (let i = 1; i < Rn - 1; i++) { const v = (prev + 2 * ridge[i] + ridge[i + 1]) / 4; prev = ridge[i]; ridge[i] = Math.min(ridge[i], v); }
    }
  }
  L.ridge = ridge;

  // Cypress: the tallest free column, preferring the left; it stays where it was while it still fits
  const hwC = clamp(0.042 * H, 26, 76);
  let cyp = null;
  if (P.showCypress === 1) {
    const old = L.cyp;
    if (old && old.x < W - hwC && freeHeight(old.x, hwC) >= old.h && old.h >= 0.22 * H) cyp = { x: old.x, h: old.h, hw: hwC };
    else {
      let best = -1e9;
      for (let x = 0.06 * W; x <= 0.94 * W; x += 16) {
        const h = Math.min(0.58 * H, freeHeight(x, hwC));
        const score = h - Math.abs(x - 0.16 * W) * 0.12;
        if (h >= 0.22 * H && score > best) { best = score; cyp = { x, h, hw: hwC }; }
      }
    }
  }
  L.cyp = cyp;

  // Church: where the hills are tallest, away from the cypress; the spire is as tall as the icons above allow
  let church = null;
  if (P.showVillage === 1) {
    let best = 0.1 * H, bx = -1;
    for (let x = 60; x < W - 60; x += 20) {
      const r = ridgeAt(x) - Math.abs(x - 0.55 * W) * 0.02 + (L.church && Math.abs(L.church.x - x) < 11 ? 12 : 0);   // it prefers not to move
      if (r > best && !(cyp && Math.abs(x - cyp.x) < cyp.hw + 70 * u)) { best = r; bx = x; }
    }
    if (bx >= 0) church = { x: bx, sp: clamp(freeHeight(bx, 12) - ridgeAt(bx) * 0.42 - 50 * u, 0, 0.13 * H) };
  }
  L.church = church;

  // Moon: a free spot high up, preferring the right; it also stays put while it fits
  const Rm = 0.095 * H;
  let moon = null;
  if (P.showMoon === 1) {
    const old = L.moon;
    if (old && clearance(old.x, old.y, [], P.halo * 0.5) >= 1.2 * Rm) moon = { x: old.x, y: old.y, r: Rm };
    else {
      let best = -1e9;
      for (let y = Rm * 1.2; y <= 0.5 * H; y += 28) for (let x = Rm * 1.2; x <= W - Rm * 1.2; x += 28) {
        const c = clearance(x, y, [], P.halo * 0.5);
        if (c < 1.2 * Rm) continue;
        const score = Math.min(c, 2.4 * Rm) + 0.25 * Rm * (x / W) - 0.3 * Rm * (y / H);
        if (score > best) { best = score; moon = { x, y, r: Rm }; }
      }
    }
  }
  L.moon = moon;

  // Swirls: each one in the widest gap that is left; the ones that still fit do not move
  const circles = moon ? [{ x: moon.x, y: moon.y, r: Rm * 1.5 }] : [];
  const pad = P.halo * 0.55, minR = 0.09 * H, maxR = 0.3 * H, swirls = [];
  for (let k = 0; k < P.swirls; k++) {
    const old = L.swirls[k];
    let s = null;
    if (old && clearance(old.x, old.y, circles, pad) >= 0.75 * old.r) s = old;
    else {
      let best = minR, bx = 0, by = 0;
      for (let y = 12; y < H; y += 24) for (let x = 12; x < W; x += 24) {
        const c = clearance(x, y, circles, pad) + rng() * 4;
        if (c > best) { best = c; bx = x; by = y; }
      }
      if (best > minR) s = { x: bx, y: by, r: Math.min(best * 0.95, maxR * (k ? 0.75 : 1)), sg: k % 2 ? -1 : 1 };
    }
    if (!s) break;
    swirls.push(s);
    circles.push({ x: s.x, y: s.y, r: s.r * 1.05 });
  }
  L.swirls = swirls;
}

/* ======================================================================
   Field. s = distance to the edge of the halos, negative inside (Meadow's cloud field);
   then the direction of the current, which turns around the halos and the swirls
   ====================================================================== */
function computeField(out) {
  const N = Gw * Gh, f1 = new Float32Array(N), s = new Float32Array(N);
  const sig = P.halo, is1 = 1 / (sig * sig), wa = 70, wmax = wa * 0.5;
  const rects = L.stars.filter(st => !st.big).map(st => ({ cx: st.cx, cy: st.cy, hw: st.hw - 4, hh: st.hh - 2 }));
  if (L.moon) rects.push({ cx: L.moon.x, cy: L.moon.y, hw: L.moon.r * 0.5, hh: L.moon.r * 0.5 });
  for (const r of rects) {
    const R = 5.5 * sig + Math.max(r.hw, r.hh) * 0.5 + wmax;
    const gx0 = Math.max(0, Math.floor((r.cx - R) / STEP)), gx1 = Math.min(Gw - 1, Math.ceil((r.cx + R) / STEP));
    const gy0 = Math.max(0, Math.floor((r.cy - R) / STEP)), gy1 = Math.min(Gh - 1, Math.ceil((r.cy + R) / STEP));
    const chw = r.hw * 0.5, chh = r.hh * 0.5;
    for (let gy = gy0; gy <= gy1; gy++) for (let gx = gx0; gx <= gx1; gx++) {
      const i = gy * Gw + gx;
      const qx = gx * STEP + NZ.wx[i] * wa, qy = gy * STEP + NZ.wy[i] * wa;
      let dx = Math.abs(qx - r.cx) - chw, dy = Math.abs(qy - r.cy) - chh;
      if (dx < 0) dx = 0; if (dy < 0) dy = 0;
      f1[i] += Math.exp(-(dx * dx + dy * dy) * is1);
    }
  }
  const c0 = Math.sqrt(-Math.log(0.35)), fMin = Math.exp(-30);
  for (let i = 0; i < N; i++) {
    const g = Math.log(Math.max(f1[i], fMin));
    s[i] = sig * (Math.sqrt(Math.max(-g, 0)) - c0) - sig * 0.6 * Math.max(g, 0);
  }
  // widgets: a ring that is brightest on their edge and fades within a few px on both sides
  const reach = 46;
  for (const st of L.stars) if (st.big) {
    const gx0 = Math.max(0, Math.floor((st.cx - st.hw - reach - 12) / STEP)), gx1 = Math.min(Gw - 1, Math.ceil((st.cx + st.hw + reach + 12) / STEP));
    const gy0 = Math.max(0, Math.floor((st.cy - st.hh - reach - 12) / STEP)), gy1 = Math.min(Gh - 1, Math.ceil((st.cy + st.hh + reach + 12) / STEP));
    for (let gy = gy0; gy <= gy1; gy++) for (let gx = gx0; gx <= gx1; gx++) {
      const i = gy * Gw + gx;
      const d = Math.abs(sdStar(gx * STEP + NZ.wx[i] * wa * 0.25, gy * STEP + NZ.wy[i] * wa * 0.25, st));
      s[i] = Math.min(s[i], -0.6 * sig + d * (0.9 * sig / reach));
    }
  }

  const rng = mulberry32(seed ^ 0x5bd1e995);
  const p1 = rng() * 6.28, p2 = rng() * 6.28, p3 = rng() * 6.28, p4 = rng() * 6.28;
  const swirls = L.swirls;
  for (let j = 0, o = 0; j < Gh; j++) {
    const y = j * STEP;
    for (let i = 0; i < Gw; i++, o += 4) {
      const x = i * STEP, n = j * Gw + i;
      // base current: drifts to the right in long waves
      const a = 0.55 * Math.sin(x * 0.0031 + p1 + 1.7 * Math.sin(y * 0.0043 + p2)) + 0.35 * Math.sin(y * 0.0061 + x * 0.0017 + p3);
      let vx = Math.cos(a), vy = Math.sin(a);
      // swirls: spirals that wind inwards, with two lighter arms
      let sw = 0, sx = 0, sy = 0, light = 0;
      for (const q of swirls) {
        const dx = x - q.x, dy = y - q.y, r = Math.hypot(dx, dy) + 1e-3, rr = r / q.r;
        const w = Math.exp(-1.6 * rr * rr);
        if (w < 0.004) continue;
        const ex = dx / r, ey = dy / r;
        let tx = -ey * q.sg - 0.3 * ex, ty = ex * q.sg - 0.3 * ey;
        const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
        sx += w * tx; sy += w * ty; sw = Math.max(sw, w);
        const arm = 0.5 + 0.5 * Math.cos(2 * (Math.atan2(dy, dx) + q.sg * Math.log(rr + 0.02) / 0.3));
        light += w * (0.35 + 0.65 * arm);
      }
      vx = (1 - sw) * vx + sx; vy = (1 - sw) * vy + sy;
      // a lighter ribbon above the horizon
      const yb = H - ridgeAt(x) - 0.13 * H + 0.035 * H * Math.sin(x * 0.006 + p4), rb = (y - yb) / (0.06 * H);
      light = Math.min(1, light + 0.4 * Math.exp(-rb * rb));

      const gx = s[n + (i < Gw - 1 ? 1 : 0)] - s[n - (i > 0 ? 1 : 0)], gy = s[n + (j < Gh - 1 ? Gw : 0)] - s[n - (j > 0 ? Gw : 0)];
      const gl2 = Math.hypot(gx, gy);
      if (gl2 > 1e-4) {
        const wh = sstep(0.6 * sig, -0.3 * sig, s[n]) * Math.min(1, gl2 / (2 * STEP) * 3);
        vx = (1 - wh) * vx - wh * gy / gl2; vy = (1 - wh) * vy + wh * gx / gl2;
      }
      out[o] = vx; out[o + 1] = vy; out[o + 2] = Math.min(s[n], 3 * sig); out[o + 3] = light;
    }
  }
}

   Shader

const VS = `#version 300 es
void main() { gl_Position = vec4(vec2(gl_VertexID == 1 ? 3.0 : -1.0, gl_VertexID == 2 ? 3.0 : -1.0), 0.0, 1.0); }`;

const FS = `#version 300 es
precision highp float;
uniform sampler2D uNoise, uField, uRidge;
uniform highp sampler2D uStrokes;   // sky strokes, worked out on the CPU
uniform vec4 uLay[4];               // per layer of strokes: cell size, first row in uStrokes, offset of the grid
uniform vec2 uRes, uGrid, uWob;
uniform float uScale, uStep, uSeed, uTime, uSig, uW, uRidgeN, uRdx, uU;
uniform vec4 uMoon;      // x, y, radius
uniform vec4 uCyp;       // x, height, half width, phase
uniform vec4 uChurch;    // x, size (0..1), height of the spire
uniform vec3 uC[29];     // palette: sky 0-7, hills 8-16, outline 17, cypress 18-21, walls 22-24, roofs 25-26, windows 27-28
out vec4 o;

const vec2 LIGHT = vec2(-0.6, -0.8);                    // the light comes from the top left

float hash2(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}
float hs(vec2 c, float k) { return hash2(c + k + uSeed); }
// four random numbers at once: the stroke loops need many per cell
vec4 h4(vec2 c, float k) {
  vec4 q = fract(vec4(c.xyxy + k + uSeed) * vec4(0.1031, 0.1030, 0.0973, 0.1099));
  q += dot(q, q.wzxy + 33.33);
  return fract((q.xxyz + q.yzzw) * q.zywx);
}
float ss(float a, float b, float x) { float t = clamp((x - a) / (b - a), 0.0, 1.0); return t * t * (3.0 - 2.0 * t); }
vec4 N(vec2 p, float scale) { return texture(uNoise, p / scale + uSeed * 0.013); }
vec4 F(vec2 q) { return texture(uField, (q / uStep + 0.5) / uGrid); }
float ridge(float x) { return texture(uRidge, vec2((x / uRdx + 0.5) / uRidgeN, 0.5)).r; }

// One brush stroke: a capsule around the segment ctr ± d * hl, half width hw. Returns its opacity;
// sh = how much this point faces the light (the paint is thick: one side of the stroke is lit)
float stroke(vec2 p, vec2 ctr, vec2 d, float hl, float hw, out float sh, out vec2 loc) {
  vec2 pa = p - ctr, n = vec2(-d.y, d.x);
  float al = dot(pa, d), ac = dot(pa, n);
  float t = clamp(al, -hl, hl);
  float w = hw * (1.0 - 0.3 * abs(t) / hl);            // slightly thinner towards the ends
  float dist = length(pa - d * t);
  float e = 0.75 / uScale + 0.25;
  sh = clamp(ac / w, -1.0, 1.0) * dot(n, LIGHT);
  loc = vec2(al, ac);
  return 1.0 - ss(w - e, w + e, dist);
}
// bristles: fine streaks along the stroke
float bristle(vec2 loc, vec2 c) { return 1.0 + 0.16 * (N(vec2(loc.x * 0.35, loc.y * 5.0) + c * 37.0, 96.0).a - 0.5); }

vec3 skyRamp(float l) {
  vec3 c = mix(uC[0], uC[1], ss(0.05, 0.42, l));
  c = mix(c, uC[2], ss(0.42, 0.72, l));
  return mix(c, uC[3], ss(0.76, 1.02, l));
}
float glowOf(float s) { return ss(0.35 * uSig, -0.95 * uSig, s); }
// One layer of sky strokes: a grid of cells, one stroke per cell. The strokes themselves (where, which way,
// how long, what colour) are worked out on the CPU each frame and come in a small texture, two texels per cell:
// (offset from the middle of the cell, direction * half length) and (colour, opacity)
void skyLayer(vec2 p, vec4 lay, float hwBase, float k, inout vec3 col) {
  float cs = lay.x; vec2 off = lay.zw; int row = int(lay.y);
  // a stroke never reaches further than one cell from the middle of its own cell (see updateStrokes),
  // so only the four cells whose middles are nearest can touch this pixel
  vec2 c0 = floor((p + off) / cs - 0.5);
  float best = -1.0, ba = 0.0, bsh = 0.0; vec2 bl = vec2(0.0), bcell = vec2(0.0); ivec2 bt = ivec2(0);
  for (int j = 0; j <= 1; j++) for (int i = 0; i <= 1; i++) {
    vec2 c = c0 + vec2(float(i), float(j));
    vec2 mid = (c + 0.5) * cs - off;
    ivec2 t = ivec2(int(c.x) + 2, int(c.y) + 2);
    vec4 g = texelFetch(uStrokes, ivec2(t.x * 2, t.y + row), 0);
    float hl = dot(g.zw, g.zw);
    if (hl < 0.0001) continue;
    vec2 ctr = mid + g.xy, pa = p - ctr;
    hl = sqrt(hl);
    float rr = hl + hwBase * 1.2 + 1.0;
    if (dot(pa, pa) > rr * rr) continue;                // too far for this stroke to reach
    float h = hash2(c + k * 13.7 + uSeed), hw = hwBase * (0.76 + 0.24 * h);
    float sh; vec2 loc;
    float a = stroke(p, ctr, g.zw / hl, hl, hw, sh, loc), pri = fract(h * 7.13);
    if (a > 0.02 && pri > best) { best = pri; ba = a; bsh = sh; bl = loc; bcell = c; bt = ivec2(t.x * 2 + 1, t.y + row); }
  }
  if (best >= 0.0) {
    vec4 cl = texelFetch(uStrokes, bt, 0);
    col = mix(col, cl.rgb * (1.0 + 0.2 * bsh) * bristle(bl, bcell), ba * cl.a);
  }
}
vec3 sky(vec2 p) {
  vec4 f = F(p);
  // underpainting: what shows between the strokes
  float wsh = N(p, 1500.0).b * 0.6 + N(p + 311.0, 500.0).g * 0.4;
  vec3 col = skyRamp(0.06 + 0.24 * wsh + 0.4 * f.w);
  float g = glowOf(f.z);
  col = mix(col, mix(uC[6], uC[4], 0.5), pow(g, 2.4) * 0.55);
  skyLayer(p, uLay[0], uW * 0.66, 1.0, col);
  skyLayer(p, uLay[1], uW * 0.62, 2.0, col);
  skyLayer(p, uLay[2], uW * 0.56, 3.0, col);
  skyLayer(p, uLay[3], uW * 0.5, 4.0, col);

  // moon: a pale disc with an orange crescent, painted in rings
  if (uMoon.z > 0.5) {
    vec2 m = p - uMoon.xy; float R = uMoon.z, lm = length(m);
    float wob = (N(p, 110.0).r - 0.5) * R * 0.07;
    float d = lm - R * 0.44 + wob;
    if (d < 1.5) {
      float inner = length(m - vec2(R * 0.2, -R * 0.05)) - R * 0.36 + (N(p + 77.0, 90.0).g - 0.5) * R * 0.06;
      float streak = N(vec2(atan(m.y, m.x) * R * 0.6, lm * 4.0), 96.0).a - 0.5;
      float rim = ss(R * 0.3, R * 0.44, lm);
      vec3 mc = mix(mix(uC[6], uC[4], 0.12 + 0.3 * streak), mix(uC[5], uC[4], rim * 0.55 + streak * 0.3), ss(1.0, -1.0, inner));
      mc *= 1.0 + 0.14 * streak + 0.1 * dot(m / max(lm, 1.0), LIGHT) * rim;
      col = mix(col, mc, ss(1.0, -1.0, d));
    }
  }
  return col;
}

// Hills. q = (x, depth below the top of this layer), so the strokes run parallel to the ridge and move with it
vec3 hillCol(int k, vec2 q) {
  int b = 8 + k * 3;
  vec3 col = mix(uC[b], uC[b + 1], ss(0.35, 0.75, N(q, 700.0).g) * 0.6);
  for (int layer = 0; layer < 2; layer++) {
    float kk = float(k) * 31.0 + float(layer) * 17.0 + 100.0;
    vec2 G = vec2(uW * 3.4, uW * 1.5) * (layer == 0 ? 1.0 : 0.85);
    vec2 qq = q + float(layer) * vec2(7.3, 3.1);
    vec2 c0 = floor(qq / G);
    float best = -1.0, ba = 0.0, bsh = 0.0; vec3 bc = vec3(0.0); vec2 bl = vec2(0.0), bcell = vec2(0.0);
    for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
      vec2 c = c0 + vec2(float(i), float(j));
      vec4 hA = h4(c, kk), hB = h4(c, kk + 71.3);
      vec2 ctr = (c + 0.5 + (hA.xy - 0.5) * 0.5) * G;
      float ang = (hA.z - 0.5) * 0.5;
      float sh; vec2 loc;
      float a = stroke(qq, ctr, vec2(cos(ang), sin(ang)), G.x * (0.4 + 0.2 * hA.w), uW * (0.42 + 0.2 * hB.x), sh, loc);
      if (a > 0.02 && hB.y > best) {
        best = hB.y; ba = a; bsh = sh; bl = loc; bcell = c;
        bc = hB.z < 0.4 ? uC[b] : (hB.z < 0.75 ? uC[b + 1] : uC[b + 2]);
        if (hB.w < 0.07) bc = uC[2];
      }
    }
    if (best >= 0.0) col = mix(col, bc * (1.0 + 0.2 * bsh) * bristle(bl, bcell), ba);
  }
  return col;
}

// A little house: walls, a gable roof and maybe a lit window. lp = px from the middle of its base, y up; k = its size (0..1)
void building(vec2 p, vec2 lp, float w, float h, float rh, float ax, float k, vec3 wallC, vec3 roofC, float lit, vec2 win, inout vec3 col) {
  lp = lp / k + (N(p, 38.0).rg - 0.5) * 2.6;            // wobbly, hand-drawn edges
  vec2 bq = abs(lp - vec2(0.0, h * 0.5)) - vec2(w * 0.5, h * 0.5);
  float dB = length(max(bq, 0.0)) + min(max(bq.x, bq.y), 0.0);
  vec2 A = vec2(-w * 0.5 - 2.0, h), B = vec2(w * 0.5 + 2.0, h), T = vec2(ax, h + rh);
  vec2 e1 = T - A, e2 = B - T;
  float dR = max(h - lp.y, max(dot(lp - A, normalize(vec2(-e1.y, e1.x))), dot(lp - T, normalize(vec2(-e2.y, e2.x)))));
  float d = min(dB, dR) * k;
  if (lit > 0.5) col += uC[27] * exp(-dot(lp - win, lp - win) / (uU * uU * 110.0)) * 0.3 * k;   // the window lights what is around it
  if (d > 2.6) return;
  vec3 c = lp.y > h ? roofC : wallC;
  c *= 0.86 + 0.28 * N(vec2(lp.x * 5.0, lp.y * 0.7) + p.x * 0.3, 96.0).a;                       // vertical brush marks
  c *= 1.0 + 0.12 * dot(normalize(lp - vec2(0.0, h * 0.6)), vec2(LIGHT.x, -LIGHT.y));
  if (lit > 0.5) {
    vec2 wq = abs(lp - win) - vec2(2.2, 2.9) * uU;
    c = mix(c, mix(uC[27], uC[28], N(p, 9.0).r), 1.0 - ss(-0.6, 0.9, max(wq.x, wq.y)));
  }
  col = mix(col, c, ss(0.7, -0.7, d));
  float inkW = 0.9 + 0.9 * N(p + 31.0, 26.0).g;
  float ink = 1.0 - ss(inkW - 0.6, inkW + 0.6, abs(d));
  ink = max(ink, (1.0 - ss(0.3, 1.2, abs(lp.y - h) * k)) * step(d, 0.0) * 0.8);                   // the line of the eaves
  col = mix(col, uC[17], ink * 0.92);
}

float cHalf(float t) { return 1.2 * uCyp.z * pow(max(1.0 - t, 0.0), 0.55) * (0.55 + 0.45 * sin(3.14159 * min(1.0, t * 1.6))); }
float cMid(float t) { return uCyp.x + sin(t * 7.0 + uCyp.w) * uCyp.z * 0.14 * t + uCyp.z * 0.25 * t; }
// Cypress: a dark flame. A narrow dark core and, over it, strokes that climb and lean outwards; the strokes make the edge
void cypress(vec2 p, float yb, inout vec3 col) {
  float t = yb / uCyp.y;
  if (t < 1.0) {
    float dx = abs(p.x - cMid(t)) - cHalf(t) * (0.72 + 0.3 * (N(p, 70.0).r - 0.5));
    col = mix(col, uC[18], ss(0.8, -0.8, dx) * ss(1.0, 0.97, t));
  }
  for (int layer = 0; layer < 2; layer++) {
    float kk = 300.0 + float(layer) * 23.0;
    vec2 G = vec2(11.0, 20.0) * uU * (layer == 0 ? 1.0 : 0.82);
    vec2 pp = p + float(layer) * vec2(5.1, 9.3);
    vec2 c0 = floor(pp / G);
    float best = -1.0, ba = 0.0, bsh = 0.0; vec3 bc = vec3(0.0); vec2 bl = vec2(0.0), bcell = vec2(0.0);
    for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
      vec2 c = c0 + vec2(float(i), float(j));
      vec4 hA = h4(c, kk), hB = h4(c, kk + 71.3);
      vec2 ctr = (c + 0.5 + (hA.xy - 0.5) * 0.5) * G - float(layer) * vec2(5.1, 9.3);
      float tc = (uRes.y - ctr.y) / uCyp.y;
      float xr = (ctr.x - cMid(tc)) / max(cHalf(tc), 1.0);
      float inside = ss(1.12, 0.95, abs(xr)) * ss(1.0, 0.95, tc) * step(0.0, tc);   // strokes come in softly as the tree grows
      if (inside < 0.01) continue;
      float ang = -1.5708 + xr * 0.42 + (hA.z - 0.5) * 0.45;
      float sh; vec2 loc;
      float a = stroke(p, ctr, vec2(cos(ang), sin(ang)), (8.0 + 6.5 * hA.w) * uU, (2.3 + 2.0 * hB.x) * uU, sh, loc) * inside;
      if (a > 0.02 && hB.y > best) {
        best = hB.y; ba = a; bsh = sh; bl = loc; bcell = c;
        float h = hB.z;
        bc = h < 0.36 ? uC[18] : (h < 0.66 ? uC[19] : (h < 0.84 ? uC[21] : (h < 0.95 ? uC[20] : uC[16])));
      }
    }
    if (best >= 0.0) col = mix(col, bc * (1.0 + 0.24 * bsh) * bristle(bl, bcell), ba);
  }
}

void main() {
  vec2 p = vec2(gl_FragCoord.x, uRes.y * uScale - gl_FragCoord.y) / uScale;
  float yb = uRes.y - p.y;                                // height above the bottom edge
  float r = ridge(p.x);
  float h0 = r, h1 = r * (0.66 + 0.1 * sin(p.x * 0.009 + uWob.x)), h2 = r * (0.36 + 0.08 * sin(p.x * 0.014 + uWob.y));
  float dep0 = h0 - yb;
  bool land = r > 0.75 && dep0 > -1.0;

  vec3 col = vec3(0.0);
  if (!land || dep0 < 1.0) col = sky(p);
  if (land) {
    // three layers of hills, the near ones darker; a dark, uneven contour along each ridge
    int k = yb < h2 ? 2 : (yb < h1 ? 1 : 0);
    float dep = (k == 0 ? h0 : (k == 1 ? h1 : h2)) - yb;
    vec3 hc = hillCol(k, vec2(p.x, dep));
    float inkW = 1.2 + 1.3 * N(p, 60.0).r;
    hc = mix(hc, uC[17], (1.0 - ss(inkW - 0.6, inkW + 0.6, abs(dep - 1.3))) * 0.9 * ss(0.75, 9.0, r));
    col = k == 0 ? mix(col, hc, ss(-0.7, 0.7, dep0)) : hc;
  }

  // village: one house per cell along the hills, where they are tall enough; hidden behind the nearest hills
  if (yb < 0.3 * uRes.y + 60.0 * uU && (yb >= h2 || r < 0.75)) {
    float HC = 58.0 * uU, ci = floor(p.x / HC);
    for (int i = -1; i <= 1; i++) {
      if (yb > 0.28 * uRes.y) break;                      // houses never stand this high
      vec2 c = vec2(ci + float(i), 3.0);
      if (hs(c, 50.0) > 0.8) continue;
      float xh = (c.x + 0.5 + (hs(c, 51.0) - 0.5) * 0.5) * HC;
      float rh = ridge(xh);
      float k = ss(0.07, 0.12, rh / uRes.y);
      if (uCyp.y > 1.0) k *= ss(uCyp.z + 12.0 * uU, uCyp.z + 44.0 * uU, abs(xh - uCyp.x));
      if (uChurch.y > 0.01) k *= ss(44.0 * uU, 70.0 * uU, abs(xh - uChurch.x - 14.0 * uU));
      if (k < 0.03) continue;
      float hb = rh * (0.4 + 0.2 * hs(c, 52.0));
      float w = (24.0 + 18.0 * hs(c, 53.0)) * uU, h = (14.0 + 10.0 * hs(c, 54.0)) * uU;
      float hw_ = hs(c, 55.0), hr = hs(c, 56.0);
      building(p, vec2(p.x - xh, yb - hb), w, h, (8.0 + 7.0 * hs(c, 57.0)) * uU, (hs(c, 58.0) - 0.5) * w * 0.4, k,
        hw_ < 0.34 ? uC[22] : (hw_ < 0.67 ? uC[23] : uC[24]), hr < 0.5 ? uC[25] : uC[26],
        step(hs(c, 59.0), 0.55), vec2((hs(c, 60.0) - 0.5) * w * 0.4, h * 0.5), col);
    }
    if (uChurch.y > 0.01 && abs(p.x - uChurch.x - 20.0 * uU) < 70.0 * uU) {
      float hb = ridge(uChurch.x) * 0.42, k = uChurch.y;
      building(p, vec2(p.x - uChurch.x - 30.0 * uU, yb - hb), 44.0 * uU, 20.0 * uU, 12.0 * uU, -4.0 * uU, k, uC[23], uC[25], 1.0, vec2(6.0, 10.0) * uU, col);
      building(p, vec2(p.x - uChurch.x, yb - hb), 24.0 * uU, 30.0 * uU, max(uChurch.z, 10.0 * uU), 0.0, k, uC[24], uC[25], 0.0, vec2(0.0), col);
    }
  }

  if (uCyp.y > 1.0 && abs(p.x - uCyp.x) < uCyp.z * 1.7 + 30.0 * uU && yb < uCyp.y + 24.0 * uU) cypress(p, yb, col);

  col *= 1.0 + (hash2(floor(p * (0.8 * max(uScale, 1.0)))) - 0.5) * 0.04;                         // grain, at the real pixels of the screen
  o = vec4(col, 1.0);
}`;

/* ======================================================================
   Sky strokes: one per cell in three grids. Every frame the CPU places each stroke along the current,
   lets it slide and fade, picks its colour, and uploads the lot as a small texture (a few thousand strokes)
   ====================================================================== */
// cell size in brush widths, layer id. Reach of a stroke from the middle of its cell, per axis:
// jitter 0.14 + slide 0.2 + half length 0.52 + half width 0.14 = 1 cell, which is what the shader counts on
const LAYERS = [[5.4, 1], [4.8, 2], [4.2, 3], [3.7, 4]];
let SK = null;
function buildStrokes() {
  const layers = []; let tw = 0, th = 0;
  for (const [m, k] of LAYERS) {
    const cs = P.stroke * m, ox = k * 7.31, oy = k * 3.77;
    const nx = Math.ceil((W + ox) / cs) + 4, ny = Math.ceil((H + oy) / cs) + 4;
    const rnd = new Float32Array(nx * ny * 9), rng = mulberry32(seed * 31 + k);
    for (let i = 0; i < rnd.length; i++) rnd[i] = rng();    // per cell: jitter x, y, speed, phase, length, 4 for the colour
    layers.push({ cs, ox, oy, nx, ny, row: th, rnd, fc: new Float32Array(nx * ny * 5) });   // fc: direction, halo distance, light, kind
    tw = Math.max(tw, nx * 2); th += ny;
  }
  SK = { layers, tw, th, buf: new Float32Array(tw * th * 4), stroke: P.stroke, seed, lay: new Float32Array(layers.flatMap(l => [l.cs, l.row, l.ox, l.oy])) };
}
const fS = new Float32Array(4);
function sampleField(x, y) {
  const fx = clamp(x / STEP, 0, Gw - 1.001), fy = clamp(y / STEP, 0, Gh - 1.001);
  const ix = fx | 0, iy = fy | 0, tx = fx - ix, ty = fy - iy, i = (iy * Gw + ix) * 4, j = i + Gw * 4;
  for (let c = 0; c < 4; c++) fS[c] = (fCur[i + c] * (1 - tx) + fCur[i + 4 + c] * tx) * (1 - ty) + (fCur[j + c] * (1 - tx) + fCur[j + 4 + c] * tx) * ty;
}
// Colour of one stroke, from where its centre is. Each stroke has a single colour: blues by chance and by the
// light of the swirls; yellows near a star, in rings that slowly move outwards; orange right under an icon
const cS = new Float32Array(3);
function strokeColor(x, y, h0, h1, h2, h3) {
  const C = colNow, sig = P.halo, s = fS[2];
  const mixC = (a, t) => { cS[0] += (C[a * 3] - cS[0]) * t; cS[1] += (C[a * 3 + 1] - cS[1]) * t; cS[2] += (C[a * 3 + 2] - cS[2]) * t; };
  const l = 0.02 + 0.56 * h0 + 0.72 * fS[3] + 0.14 * (y / H - 0.5);
  cS[0] = C[0]; cS[1] = C[1]; cS[2] = C[2];
  mixC(1, sstep(0.05, 0.42, l)); mixC(2, sstep(0.42, 0.72, l)); mixC(3, sstep(0.76, 1.02, l));
  if (h1 > 0.87) mixC(7, 0.55 * (1 - sstep(0.55, 0.9, l)));
  const g = sstep(0.35 * sig, -0.95 * sig, s);
  if (g < 0.002) return;
  const ring = 0.5 + 0.5 * Math.sin(6.28318 * s / (P.stroke * 5) - phase * 0.45);
  const prob = Math.pow(g, 1.7) * (0.35 + 0.65 * ring) * (1 - sstep(0.88, 1, g)) + sstep(0.88, 1, g);   // dense by the icon, scattered further out

  mixC(5, sstep(0.25, 0.85, h0 * 0.6 + ring * 0.4) * (1 - 0.7 * core));
  mixC(6, Math.max(core * (0.45 + 0.4 * h2), h2 > 0.86 ? 0.6 : 0));

// Most of a stroke only changes when the field or the palette does (its direction, the light, its colour),
// so that part is kept; every third frame only the slide and the fade are redone, plus the colour of the

let skDirty = true;
function updateStrokes() {
  if (!SK || SK.stroke !== P.stroke || SK.seed !== seed) { buildStrokes(); skDirty = true; }
  const buf = SK.buf, tw = SK.tw, full = skDirty, sig = P.halo;
  for (const ly of SK.layers) {
    const { cs, ox, oy, nx, ny, rnd, fc } = ly;

      const n = j * nx + i, q = n * 9, c = n * 5, o = ((ly.row + j) * tw + i * 2) * 4;
      const mx = (i - 1.5) * cs - ox, my = (j - 1.5) * cs - oy;          // middle of the cell
      const x0 = mx + (rnd[q] - 0.5) * 0.28 * cs, y0 = my + (rnd[q + 1] - 0.5) * 0.28 * cs;
      if (full) {
        if (x0 < -1.4 * cs || y0 < -1.4 * cs || x0 > W + 1.4 * cs || y0 > H + 1.4 * cs) { fc[c + 4] = -1; buf[o + 2] = buf[o + 3] = 0; continue; }
        sampleField(x0, y0);
        const vl = Math.hypot(fS[0], fS[1]) || 1;
        fc[c] = fS[0] / vl; fc[c + 1] = fS[1] / vl; fc[c + 2] = fS[2]; fc[c + 3] = fS[3];
        fc[c + 4] = fS[2] < 0.35 * sig ? 1 : 0;                           // 1 = inside a halo
        strokeColor(x0, y0, rnd[q + 5], rnd[q + 6], rnd[q + 7], rnd[q + 8]);
        buf[o + 4] = cS[0]; buf[o + 5] = cS[1]; buf[o + 6] = cS[2];
      } else if (fc[c + 4] < 0) continue;                                 // off the screen
      const ph = (phase * 0.07 * (0.7 + 0.6 * rnd[q + 2]) + rnd[q + 3]) % 1;
      const life = sstep(0, 0.22, ph) * sstep(1, 0.78, ph);
      if (life < 0.004) { buf[o + 2] = buf[o + 3] = 0; continue; }
      const dx = fc[c], dy = fc[c + 1], hl = cs * (0.4 + 0.12 * rnd[q + 4]);
      const sl = (ph - 0.5) * 0.4 * cs;                                  // it slides along the current
      buf[o] = x0 + dx * sl - mx; buf[o + 1] = y0 + dy * sl - my; buf[o + 2] = dx * hl; buf[o + 3] = dy * hl;
      buf[o + 7] = life;
      if (!full && fc[c + 4] > 0) {
        fS[2] = fc[c + 2]; fS[3] = fc[c + 3];
        strokeColor(x0, y0, rnd[q + 5], rnd[q + 6], rnd[q + 7], rnd[q + 8]);
        buf[o + 4] = cS[0]; buf[o + 5] = cS[1]; buf[o + 6] = cS[2];

  if (!SK.made) { gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, tw, SK.th, 0, gl.RGBA, gl.FLOAT, buf); SK.made = true; }

/* ======================================================================
   WebGL
   ====================================================================== */
let PR = null, texField = null, texNoise = null, texRidge = null, texStrokes = null;
function program(fs) {
  const mk = (type, src) => {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  };

  gl.attachShader(p, mk(gl.VERTEX_SHADER, VS)); gl.attachShader(p, mk(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));

  for (let i = 0; i < n; i++) { const name = gl.getActiveUniform(p, i).name.replace(/\[0\]$/, ''); U[name] = gl.getUniformLocation(p, name); }

function initGL() {

  const { S, d } = makeNoiseImage();
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, S, S, 0, gl.RGBA, gl.UNSIGNED_BYTE, d);
  gl.generateMipmap(gl.TEXTURE_2D);

  texRidge = texture(gl.CLAMP_TO_EDGE);

  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);

/* ======================================================================
   Blend of the old and the new state
   ====================================================================== */
// An object that changes place shrinks where it was and grows where it goes; if it stays, it just changes size
function objMix(a, b, m, sizeIdx, planar) {
  if (!a && !b) return [0, 0, 0];
  if (a && b && Math.abs(a[0] - b[0]) + (planar ? Math.abs(a[1] - b[1]) : 0) < 3) return a.map((v, i) => v + (b[i] - v) * m);
  const src = m < 0.5 ? a : b;
  if (!src) return [0, 0, 0];
  const k = sstep(0, 1, m < 0.5 ? 1 - 2 * m : 2 * m - 1), out = src.slice();

}
const curObjs = () => ({
  moon: objMix(oFrom.moon, oTo.moon, curMix, [2], true),
  cyp: objMix(oFrom.cyp, oTo.cyp, curMix, [1, 2], false),
  church: objMix(oFrom.church, oTo.church, curMix, [1], false),
});
function mixState(m) {
  for (let i = 0; i < fCur.length; i++) fCur[i] = fFrom[i] + (fTo[i] - fFrom[i]) * m;
  for (let i = 0; i < rCur.length; i++) rCur[i] = rFrom[i] + (rTo[i] - rFrom[i]) * m;
}
function uploadState() {
  mixState(curMix);
  gl.bindTexture(gl.TEXTURE_2D, texField);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, Gw, Gh, 0, gl.RGBA, gl.FLOAT, fCur);
  gl.bindTexture(gl.TEXTURE_2D, texRidge);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.R16F, Rn, 1, 0, gl.RED, gl.FLOAT, rCur);
  sentMix = curMix; skDirty = true;
}
// New layout; what is on screen now becomes the starting point
function commit(dur) {
  const now = performance.now();
  if (curMix < 1) {
    mixState(curMix);
    const c = curObjs(), keep = (v, i) => v[i] > 0.5 ? v : null;
    oFrom = { moon: keep(c.moon, 2), cyp: keep(c.cyp, 1), church: c.church[1] > 0.01 ? c.church : null };
    fFrom.set(fCur); rFrom.set(rCur);
  } else { fFrom.set(fTo); rFrom.set(rTo); oFrom = oTo; }
  layout();
  computeField(fTo);
  rTo.set(L.ridge);
  oTo = {
    moon: L.moon && [L.moon.x, L.moon.y, L.moon.r],
    cyp: L.cyp && [L.cyp.x, L.cyp.h, L.cyp.hw],
    church: L.church && [L.church.x, 1, L.church.sp],
  };
  morphT0 = now; morphDur = dur; curMix = 0; sentMix = -1;
  if (colTo !== PALS[P.palette].rgb) { colFrom = colNow.slice(); colTo = PALS[P.palette].rgb; colT0 = now; }
  dirty = true;
}
// Show the target at once, with nothing to blend from
function snap() { fFrom.set(fTo); rFrom.set(rTo); oFrom = oTo; morphT0 = -1e9; curMix = 1; sentMix = -1; }

function resize() {
  W = innerWidth; H = innerHeight; SK = null;
  // Preview: the page is laid out at desktop size and shown scaled down, so a low resolution is enough
  const scale = PREVIEW ? 0.45 : Math.min(devicePixelRatio || 1, P.quality);
  const box = cv.getBoundingClientRect();              // fractional size, so the canvas matches the screen pixels
  cv.width = Math.round((box.width || W) * scale); cv.height = Math.round((box.height || H) * scale); cv._scale = scale;
  Gw = Math.ceil(W / STEP) + 2; Gh = Math.ceil(H / STEP) + 2; Rn = Math.ceil(W / RDX) + 2;
  fFrom = new Float32Array(Gw * Gh * 4); fTo = new Float32Array(Gw * Gh * 4); fCur = new Float32Array(Gw * Gh * 4);
  rFrom = new Float32Array(Rn); rTo = new Float32Array(Rn); rCur = new Float32Array(Rn);
  L.swirls = []; L.moon = null; L.cyp = null; L.church = null;
  oFrom = oTo = { moon: null, cyp: null, church: null }; curMix = 1;
  buildWarp();
  commit(1);
  snap();
}

/* ======================================================================
   Frame
   ====================================================================== */
const PAL_MS = 700;
let lastCm = -1;
function frame(now) {
  requestAnimationFrame(frame);
  if (paused) { lastT = 0; return; }
  if (now - lastT < 31) return;                        // 30 fps
  const dt = lastT ? Math.min((now - lastT) / 1000, 0.1) : 0.033;
  lastT = now;
  phase += dt * P.speed;
  frameN++;
  const moving = P.speed > 0 || now - morphT0 < morphDur + 100 || now - colT0 < PAL_MS + 100;
  if (!moving && !dirty) return;                       // nothing changes: keep the last picture
  draw(now);
}
function draw(now) {
  const cw = cv.width, ch = cv.height, sc = cv._scale || 1;
  curMix = ease((now - morphT0) / morphDur);
  if (curMix !== sentMix) uploadState();
  const cm = ease((now - colT0) / PAL_MS);
  if (cm !== lastCm) { for (let i = 0; i < colNow.length; i++) colNow[i] = colFrom[i] + (colTo[i] - colFrom[i]) * cm; lastCm = cm; skDirty = true; }
  if (!SK || skDirty || SK.stroke !== P.stroke || SK.seed !== seed || frameN % 3 === 0) updateStrokes();   // the strokes move slowly: ten times a second is enough
  const rs = mulberry32(seed), U = PR.U, ob = curObjs();

  gl.viewport(0, 0, cw, ch);
  gl.useProgram(PR.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texNoise); gl.uniform1i(U.uNoise, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, texField); gl.uniform1i(U.uField, 1);

/* ======================================================================
   Settings and messages
   ====================================================================== */
let iconsSeen = !(WALL || PREVIEW);
function applySettings(v) {
  let relayout = false;
  if (typeof v.seed === 'number' && v.seed !== seed) {
    seed = v.seed; L.swirls = []; L.moon = null; L.cyp = null; L.church = null;
    buildWarp(); relayout = true;
  }
  for (const k in v) {
    if (!RANGE[k] || typeof v[k] !== 'number' || !isFinite(v[k])) continue;
    let val = clamp(v[k], RANGE[k][0], RANGE[k][1]);
    if (INTEGER.includes(k)) val = Math.round(val);
    if (P[k] === val) continue;
    P[k] = val;
    if (k !== 'speed' && k !== 'stroke') relayout = true;
  }
  if (relayout) { commit(700); if (!iconsSeen) snap(); } else dirty = true;

const ghostBox = document.getElementById('ghosts');
function drawGhosts() {
  ghostBox.innerHTML = icons.map(ic => `<div class="ghost" style="left:${ic.x}px;top:${ic.y}px;width:${ic.w}px;height:${ic.h}px"><i></i><b></b></div>`).join('');
}

function startHostedMode() {
  document.body.classList.add('wall');
  let last = '', first = true;
  const handle = m => {
    if (m.t === 'pause') { paused = PREVIEW ? false : !!m.v; return; }
    if (m.t === 'settings') { applySettings(m.v || {}); return; }
    if (m.t === 'reset') { applySettings(Object.assign({}, DEFAULTS, m.v || {})); return; }
    if (m.t !== 'icons') return;
    const sig = JSON.stringify([m.vis, m.r]);
    if (sig === last) return;                          // same icons as before: nothing to do
    last = sig;
    const k = window.devicePixelRatio || 1;            // physical pixels → CSS pixels
    icons = m.vis ? m.r.map(([l, t, r, b]) => ({ x: l / k, y: t / k, w: (r - l) / k, h: (b - t) / k })) : [];

    iconsSeen = true;
    commit(first ? 2600 : MORPH_MS);                   // first time the stars light up slowly
    first = false;
  };
  if (PREVIEW) {
    addEventListener('message', ev => { if (ev.source === parent) handle(typeof ev.data === 'string' ? JSON.parse(ev.data) : ev.data); });
    parent.postMessage(JSON.stringify({ t: 'ready' }), '*');
    return;
  }
  const host = window.chrome && window.chrome.webview;
  if (!host) return;
  host.addEventListener('message', ev => handle(JSON.parse(ev.data)));
  host.postMessage('ready');
}

// Browser demo: a few made-up icons that can be dragged
function startDemo() {
  document.body.classList.add('demo');
  const w = 84, h = 96, add = (x, y, ww, hh) => icons.push({ x, y, w: ww || w, h: hh || h });
  for (let i = 0; i < 5; i++) add(W - 110, 40 + i * 112);
  add(W - 222, 40); add(W * 0.3, H * 0.2); add(W * 0.3 + 96, H * 0.2); add(W * 0.55, H * 0.46); add(W * 0.1, H * 0.34);
  add(40, 40, 170, 170);                               // a widget
  drawGhosts();
  let drag = null;
  ghostBox.addEventListener('pointerdown', e => {
    const el = e.target.closest('.ghost'); if (!el) return;
    const ic = icons[[...ghostBox.children].indexOf(el)];
    drag = { el, ic, dx: e.clientX - ic.x, dy: e.clientY - ic.y };
    el.classList.add('drag'); el.setPointerCapture(e.pointerId);
  });
  ghostBox.addEventListener('pointermove', e => {
    if (!drag) return;
    drag.ic.x = clamp(e.clientX - drag.dx, 0, W - drag.ic.w); drag.ic.y = clamp(e.clientY - drag.dy, 0, H - drag.ic.h);
    drag.el.style.left = drag.ic.x + 'px'; drag.el.style.top = drag.ic.y + 'px';
  });
  const drop = () => { if (!drag) return; drag.el.classList.remove('drag'); drag = null; commit(MORPH_MS); };
  ghostBox.addEventListener('pointerup', drop); ghostBox.addEventListener('pointercancel', drop);
  commit(2600);
}

let resizeT = 0;
addEventListener('resize', () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => {
    if (!(WALL || PREVIEW)) for (const ic of icons) { ic.x = clamp(ic.x, 0, innerWidth - ic.w); ic.y = clamp(ic.y, 0, innerHeight - ic.h); }
    resize();
    if (!(WALL || PREVIEW)) drawGhosts();
    if (icons.length) { commit(1); snap(); }
  }, 100);
});

/* ---------- start ---------- */
if (!gl) document.getElementById('nogl').style.display = 'flex';
else {
  window.__dbg = { P, L, applySettings, commit };
  initGL();
  resize();

}
